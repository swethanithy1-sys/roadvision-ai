spring:
  application:
    name: roadvision-ai

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roadvision}
    username: ${DB_USER:roadvision}
    password: ${DB_PASSWORD:roadvision}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-in-production-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    public-path: ${UPLOAD_PUBLIC_PATH:/api/uploads}
  seed:
    enabled: ${SEED_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:mock}
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:15000}
    roboflow:
      base-url: ${ROBOFLOW_BASE_URL:https://serverless.roboflow.com}
      api-key: ${ROBOFLOW_API_KEY:}
      model-id: ${ROBOFLOW_MODEL_ID:}
      confidence-threshold: ${ROBOFLOW_CONFIDENCE_THRESHOLD:0.25}
  cost:
    provider: ${COST_PROVIDER:rule}
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}

logging:
  level:
    com.roadvision: ${LOG_LEVEL:INFO}
