services:
  postgres:
    image: postgres:16-alpine
    container_name: roadvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadvision
      POSTGRES_USER: roadvision
      POSTGRES_PASSWORD: roadvision
    ports:
      - "5432:5432"
    volumes:
      - roadvision-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadvision -d roadvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: roadvision-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@roadvision.ai
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  roadvision-pgdata:
